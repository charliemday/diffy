<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northline · Preview</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, serif;
        color: #14201a;
        background: #f4f7f5;
      }
      header {
        padding: 1.25rem 2rem;
        border-bottom: 1px solid #d5ddd8;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .hero {
        display: grid;
        gap: 1.5rem;
        padding: 3rem 2rem;
        max-width: 960px;
      }
      h1 {
        font-size: 2.75rem;
        margin: 0;
        line-height: 1.05;
      }
      .cta {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        background: #0f6b57;
        color: white;
        text-decoration: none;
        border-radius: 6px;
      }
      .hero img {
        width: 100%;
        max-width: 520px;
        border-radius: 12px;
      }
      .feature {
        padding: 2rem;
        max-width: 640px;
      }
      .press {
        padding: 1.5rem 2rem 3rem;
        color: #4a5c52;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <header><div class="brand">Northline</div></header>
    <section class="hero">
      <div>
        <h1>Pack light. Stay out longer.</h1>
        <p>Packs, shells, and kits for multi-day routes.</p>
        <a class="cta" href="#">Shop the spring kit</a>
      </div>
      <img
        src="/demo/hero-after.svg"
        alt="Sunlit alpine camp with pack and tent"
        width="640"
        height="400"
      />
    </section>
    <section class="feature">
      <h2>Weatherproof shells</h2>
      <p>
        Three-layer shells that breathe on the climb and seal when the squall
        hits.
      </p>
    </section>
    <section class="press">
      <p>As seen in Outside, Trail Runner, and Wirecutter.</p>
    </section>
  </body>
</html>
