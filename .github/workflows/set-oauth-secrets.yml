name: Set Cloudflare OAuth secrets

on:
  workflow_dispatch:

jobs:
  put-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Put GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET on Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Actions forbids secret names starting with GITHUB_
          GITHUB_CLIENT_ID: ${{ secrets.DIFFY_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.DIFFY_GITHUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${GITHUB_CLIENT_ID:-}"
          test -n "${GITHUB_CLIENT_SECRET:-}"
          printf '%s' "$GITHUB_CLIENT_ID" | npx wrangler secret put GITHUB_CLIENT_ID
          printf '%s' "$GITHUB_CLIENT_SECRET" | npx wrangler secret put GITHUB_CLIENT_SECRET
          echo "Worker OAuth secrets updated."
